steps:
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'moneyantra',
      '--source=.',
      '--region=us-central1',
      '--platform=managed',
      '--allow-unauthenticated',
      '--runtime=nodejs18'  # ✅ Force Node.js
    ]

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
timeout: '900s'
