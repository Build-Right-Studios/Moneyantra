options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET  

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'moneyantra-backend', 
      '--source=.', 
      '--region=us-central1', 
      '--platform=managed', 
      '--allow-unauthenticated'
    ]

timeout: '900s'
