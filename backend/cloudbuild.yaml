steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'moneyantra', 
      '--source=.', 
      '--region=us-central1', 
      '--platform=managed', 
      '--allow-unauthenticated',
      '--set-env-vars=GOOGLE_ENTRYPOINT=node app.js'
    ]

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
timeout: '900s'
